contexts_dir = "~/dev/contexts"
branch_prefix = "mb/"

[[status]]
name = "claude"
builtin = "agent"

[[status]]
name = "pr"
builtin = "github-pr"

[[status]]
name = "ci"
builtin = "github-checks"

[layout]
split = "row"

[[layout.panes]]
split = "column"
[[layout.panes.panes]]
command = "lazygit"
[[layout.panes.panes]]
command = "nvim"

[[layout.panes]]
command = "claude"
focus = true
