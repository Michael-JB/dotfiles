contexts_dir = "~/dev/contexts"
branch_prefix = "mb/"

[[status]]
name = "claude"
builtin = "agent"

[[status]]
name = "pr"
builtin = "github"

# Kanagawa Wave, to match the terminal theme.
[theme]
foreground = "#dcd7ba"
selection = "#2d4f67"
border_active = "#ffa066"
border_inactive = "#54546d"

[layout]
split = "row"

[[layout.panes]]
command = "lazygit"

[[layout.panes]]
builtin = "claude"
focus = true
